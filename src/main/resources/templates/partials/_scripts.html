<!-- Scroll to Top Button-->
<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>

<!-- Logout Modal -->
<div class="modal fade" id="logoutModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title"><i class="fas fa-info-triangle mr-2"></i>Logout
                    Session</h5>
                <button type="button" class="close text-white" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to logout <strong>session</strong>?</p>
                <div class="alert alert-info mb-0"><i class="fas fa-info-circle mr-1"></i>You
                    can always come back.</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-outline-secondary" data-dismiss="modal"><i
                        class="fas fa-times mr-1"></i>Cancel</button>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </div>
</div>

<!-- Floating Alerts -->
<div th:if="${message}" id="floatingAlertSuccess"
    class="alert alert-success alert-dismissible fade show position-fixed shadow" role="alert"
    style="z-index: 1080; min-width: 300px; top: 20px; right: 20px;">

    <i class="fas fa-check-circle mr-2"></i>
    <strong th:text="${message}">Success!</strong>

    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
    </button>
</div>

<div th:if="${error}" id="floatingAlertError"
    class="alert alert-danger alert-dismissible fade show position-fixed shadow" role="alert"
    style="z-index: 1080; min-width: 300px; top: 20px; right: 20px;">

    <i class="fas fa-exclamation-triangle mr-2"></i>
    <strong th:text="${error}">Error!</strong>

    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<!-- End Floating Alerts-->
