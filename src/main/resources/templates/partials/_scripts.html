</a>

<!-- Logout Modal-->
<div class="modal fade" id="logoutModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-body my-2 text-center">
                <h1><a href="#"><i class="bi bi-info-circle text-danger"></i></a></h1>
                <h5 class="text-center">
                    Confirm to Logout
                </h5>
                <div class="row my-2 justify-content-center">
                    <button class="btn col-sm-4 btn-warning mx-2" data-bs-dismiss="modal">Cancel</button>

                    <form class="col-sm-4 btn-success mx-2" th:action="@{/logout}" method="post">
                        <button class="btn btn-success" type="submit">Proceed</button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div><!-- End Logout Modal-->
