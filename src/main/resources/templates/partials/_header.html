<head th:fragment="common_header(title,links,metas)">

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<!-- Favicons -->
	<link th:href="@{/images/mfano.png}" rel="icon">

	<title th:utext="${title}">-- MCFS HOME--</title>
	<meta content="" name="description">
	<meta content="" name="keywords">
	<th:block th:replace="${metas} ?: ~{}" />

    <!-- Custom fonts for this template-->
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!-- Custom styles for this template-->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
	<th:block th:replace="${links} ?: ~{}" />

</head>
