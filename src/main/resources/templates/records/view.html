<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title th:text="${document.referenceNumber}">
        Document Viewer
    </title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .viewer {
            width: 100%;
            height: 100vh;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .image-viewer {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
        }

        .image-viewer img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }
    </style>
</head>

<body>

<div class="viewer"
     th:if="${document.contentType == 'application/pdf'}">

    <iframe th:src="@{/documents/file/{id}(id=${document.id})}">
    </iframe>

</div>


<div class="image-viewer"
     th:if="${#strings.startsWith(document.contentType, 'image/')}">

    <img th:src="@{/documents/file/{id}(id=${document.id})}"
         th:alt="${document.fileName}">
</div>


<div class="viewer"
     th:if="${document.contentType == 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
          or document.contentType == 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
          or document.contentType == 'application/vnd.openxmlformats-officedocument.presentationml.presentation'}">

    <iframe
        th:src="'https://view.officeapps.live.com/op/view.aspx?src='
                 + ${#uris.escapeQueryParam(
                     'https://mcfs.com/documents/file/' + document.id
                   )}">
    </iframe>

</div>

</body>
</html>
