<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{partials/_header :: common_header(~{::title/text()},~{::link},~{::meta})}">
    <!-- Custom meta data for this template-->
    <meta name="description" content="mpos error page">
    <meta name="author" content="mfano">

    <!-- Custom title for this page-->

    <title>500 - Server Error</title>

    <!-- Custom styles for this page-->
</th:block>

<body>
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="text-center">
            <h1 class="display-1 fw-bold">500</h1>
            <h2 class="mb-3">Something Went Wrong</h2>
            <p class="text-muted mb-4">
                We're sorry, but something went wrong while processing
                your request.
            </p>

            <a th:href="@{/}" class="btn btn-outline-primary">
                Go Home
            </a>

            <button onclick="location.reload()" class="btn btn-outline-secondary ms-2">
                Try Again
            </button>
        </div>
    </div>
</body>

</html>
