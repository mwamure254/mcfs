<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{partials/_header :: common_header(~{::title/text()},~{::link},~{::meta})}">
    <!-- Custom meta data for this template-->
    <meta name="description" content="mcfs audit page">
    <meta name="author" content="mfano">

    <!-- Custom title for this page-->
    <title>MCFS | Audit Entries</title>

    <!-- Custom styles for this page-->
</th:block>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- ======= Sidebar ======= -->
        <th:block th:insert="~{partials/_sidebar}" />
        <!-- =====End Sidebar=====-->

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- ======= Topbar ======= -->
                <th:block th:insert="~{partials/_topbar}" />
                <!-- =====End Topbar=====-->

                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <h4 class="mt-4">Audit log (latest)</h4>
                    <table class="table table-sm" th:if="${auditEntries != null}">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Action</th>
                                <th>Performed By</th>
                                <th>Details</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="a : ${auditEntries}">
                                <td th:text="${a.id}"></td>
                                <td th:text="${a.action}"></td>
                                <td th:text="${a.createdBy}"></td>
                                <td th:text="${a.details}"></td>
                                <td th:text="${a.createdAt}"></td>
                            </tr>
                        </tbody>
                    </table>

                </div>
                <!-- /.container-fluid -->

            </div>
            <!-- End of Main Content -->

            <!-- ======= footer ======= -->
            <th:block th:insert="~{partials/_footer}" />
            <!-- =====End footer=====-->

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

    <!-- ======= scripts ======= -->
    <th:block th:insert="~{partials/_scripts}" />
    <!-- =====End scripts=====-->
</body>

</html>
