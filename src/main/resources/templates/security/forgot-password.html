<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{partials/_header :: common_header(~{::title/text()},~{::link},~{::meta})}">
    <!-- Custom meta data for this template-->
    <meta name="description" content="mcfs forgot page">
    <meta name="author" content="mfano">

    <!-- Custom title for this page-->
    <title>MCFS | Forgot Password</title>

    <!-- Custom styles for this page-->
</th:block>

<body class="bg-login-image">

    <body class="bg-gradient-primary">

        <div class="container">

            <!-- Outer Row -->
            <div class="row justify-content-center">

                <div class="col-xl-10 col-lg-12 col-md-9">

                    <div class="card o-hidden border-0 shadow-lg my-5">
                        <div class="card-body p-0">
                            <!-- Nested Row within Card Body -->
                            <div class="row">
                                <div class="col-lg-6 d-none d-lg-block bg-login-image">
                                    <img src="/images/undraw_rocket.svg" alt="...">
                                </div>
                                <div class="col-lg-6">
                                    <div class="p-5">
                                        <div class="text-center">
                                            <h1 class="h4 text-gray-900 mb-2">Forgot Your Password?</h1>
                                            <p class="mb-4">We get it, stuff happens. Just enter your email address
                                                below
                                                and we'll send you a link to reset your password!</p>
                                        </div>
                                        <form class="user" th:action="@{/forget}" method="post">
                                            <div class="form-group">
                                                <input type="email" name="email" class="form-control form-control"
                                                    id="exampleInputEmail" aria-describedby="emailHelp"
                                                    placeholder="Enter Email Address..." needs-validation required>
                                            </div>
                                            <button type="submit" class="btn btn-primary btn-block">
                                                Reset Password
                                            </button>
                                        </form>
                                        <hr>
                                        <div class="text-center">
                                            <a class="small" href="/login">Back to Login!</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

            </div>

        </div>

        <!-- ======= scripts ======= -->
        <th:block th:insert="~{partials/_scripts}" />
        <!-- =====End scripts=====-->
    </body>

</html>
